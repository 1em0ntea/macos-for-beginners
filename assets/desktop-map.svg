<text x="952" y="205" font-size="20" fill="#52677e" text-anchor="start" data-max-width="282">当前应用的菜单在这里。</text>
<text x="952" y="234" font-size="20" fill="#52677e" text-anchor="start" data-max-width="282">它会随着所选应用变化。</text>
<circle cx="970" cy="288" r="17" fill="#245fc5"/>
