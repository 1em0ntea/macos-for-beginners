<text x="952" y="467" font-size="20" fill="#52677e" text-anchor="start" data-max-width="282">打开或切换常用应用。</text>
<text x="952" y="496" font-size="20" fill="#52677e" text-anchor="start" data-max-width="282">移除入口不会卸载应用。</text>
<circle cx="970" cy="550" r="17" fill="#245fc5"/>
<text x="970" y="557" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="700" data-max-width="25">4</text>
