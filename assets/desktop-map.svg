<text x="952" y="598" font-size="20" fill="#52677e" text-anchor="start" data-max-width="282">查看网络、声音等状态。</text>
<text x="952" y="627" font-size="20" fill="#52677e" text-anchor="start" data-max-width="282">可从控制中心调整设置。</text>
