<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">DMG 拖移安装：先复制，再从应用程序打开</title>
<desc id="diagram-desc">仅适用于明确提示拖移安装的DMG。打开安装文件，把应用拖到应用程序，完成复制后从应用程序启动，然后推出磁盘映像。</desc>
<metadata>Original diagram for 1em0ntea/macos-for-beginners. CC BY 4.0. 2026-10-05. Not a screenshot.</metadata>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#245fc5"/></marker></defs>
<g font-family="Microsoft YaHei UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#18304a">
<rect x="0" y="0" width="1280" height="760" rx="0" fill="#ffffff"/>
<text x="44" y="55" font-size="34" fill="#18304a" text-anchor="start" font-weight="700" data-max-width="1192">DMG 拖移安装：先复制，再从应用程序打开</text>
<text x="44" y="92" font-size="20" fill="#52677e" text-anchor="start" data-max-width="1192">原创示意图 · 先认操作对象，再按正文步骤尝试</text>
<rect x="44" y="154" width="270" height="377" rx="12" fill="#f7f9fc" stroke="#c9d6e4" stroke-width="2"/>
<text x="67" y="197" font-size="24" fill="#18304a" text-anchor="start" font-weight="700" data-max-width="224">1  打开 DMG</text>
<rect x="366" y="154" width="486" height="377" rx="12" fill="#f7f9fc" stroke="#c9d6e4" stroke-width="2"/>
<text x="389" y="197" font-size="24" fill="#18304a" text-anchor="start" font-weight="700" data-max-width="440">2  完成拖移复制</text>
<rect x="904" y="154" width="332" height="377" rx="12" fill="#f7f9fc" stroke="#c9d6e4" stroke-width="2"/>
<text x="927" y="197" font-size="24" fill="#18304a" text-anchor="start" font-weight="700" data-max-width="286">3  打开已安装的应用</text>
<rect x="134" y="252" width="92" height="119" rx="9" fill="#ffffff" stroke="#c9d6e4" stroke-width="2"/>
<text x="180" y="318" font-size="25" fill="#18304a" text-anchor="middle" font-weight="700" data-max-width="84">DMG</text>
<text x="179" y="419" font-size="23" fill="#18304a" text-anchor="middle" data-max-width="224">示例应用.dmg</text>
<text x="179" y="471" font-size="21" fill="#52677e" text-anchor="middle" data-max-width="224">连按打开安装载体</text>
<line x1="326" y1="340" x2="352" y2="340" stroke="#245fc5" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="396" y="254" width="135" height="116" rx="17" fill="#dceaff"/>
<text x="463" y="321" font-size="27" fill="#245fc5" text-anchor="middle" font-weight="700" data-max-width="119">应用</text>
<rect x="675" y="254" width="147" height="116" rx="17" fill="#e4edf5"/>
<text x="748" y="322" font-size="25" fill="#18304a" text-anchor="middle" font-weight="700" data-max-width="131">应用程序</text>
<line x1="549" y1="313" x2="657" y2="313" stroke="#245fc5" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="603" y="358" font-size="21" fill="#245fc5" text-anchor="middle" data-max-width="115">拖移</text>
<text x="609" y="419" font-size="21" fill="#18304a" text-anchor="middle" data-max-width="440">按窗口提示拖移，等复制完成。</text>
<text x="609" y="471" font-size="20" fill="#52677e" text-anchor="middle" data-max-width="440">此时仍在临时磁盘映像中。</text>
<line x1="864" y1="340" x2="890" y2="340" stroke="#245fc5" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="929" y="252" width="281" height="120" rx="10" fill="#ffffff" stroke="#c9d6e4" stroke-width="2"/>
<text x="1069" y="292" font-size="22" fill="#18304a" text-anchor="middle" font-weight="700" data-max-width="245">访达 · 应用程序</text>
<rect x="956" y="311" width="228" height="42" rx="7" fill="#edf4ff"/>
<text x="1070" y="339" font-size="22" fill="#245fc5" text-anchor="middle" data-max-width="212">示例应用</text>
<text x="1070" y="419" font-size="21" fill="#18304a" text-anchor="middle" data-max-width="286">从这个文件夹打开应用。</text>
<text x="1070" y="471" font-size="20" fill="#52677e" text-anchor="middle" data-max-width="286">不是直接从 DMG 里运行。</text>
<rect x="44" y="557" width="1192" height="97" rx="12" fill="#edf4ff"/>
<circle cx="77" cy="594" r="17" fill="#245fc5"/>
<text x="77" y="601" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="700" data-max-width="25">4</text>
<text x="110" y="602" font-size="25" fill="#18304a" text-anchor="start" font-weight="700" data-max-width="1100">推出磁盘映像，再确认应用仍能打开。</text>
<text x="110" y="633" font-size="20" fill="#52677e" text-anchor="start" data-max-width="1100">仅适用于明确提示拖移安装的 DMG。其他安装方式按开发者说明操作。</text>
<line x1="44" y1="695" x2="1236" y2="695" stroke="#c9d6e4" stroke-width="1" stroke-linecap="round"/>
<text x="44" y="730" font-size="18" fill="#52677e" text-anchor="start" data-max-width="1192">适用范围：macOS Ventura 13 及之后的通用概念 · 外观与位置以实际系统为准</text>
</g>
</svg>
